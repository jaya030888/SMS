services:
  # Next.js Web Service
  - type: web
    name: nextjs-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString

databases:
  - name: postgres-db
    databaseName: Applications
    user: applications_user
    plan: free
